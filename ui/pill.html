<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>brqs-whisper — dyktowanie</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Pigułka dyktowania u dołu ekranu, jak na macOS. Okno bez fokusu
       (WS_EX_NOACTIVATE): klik w głośnik nie zabiera kursora z pola,
       do którego wklei się tekst. */
    html, body { background: transparent; overflow: hidden; }
    body { display: grid; place-items: center; height: 100vh; margin: 0; color: #fff; }
    /* Ciemna jak sekcje strony Breydaqs, prawie kwadratowe rogi. */
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 4px;
      background: color-mix(in oklab, var(--dark) 94%, transparent); color: var(--light);
      font-size: 14px; font-weight: 600; white-space: nowrap; max-width: 340px; }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .pill .key { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: color-mix(in oklab, var(--light) 60%, var(--dark)); font-weight: 500; }
    .pill .msg { overflow: hidden; text-overflow: ellipsis; }
    .pill .ok { color: #6fcf97; }
    .pill .warn { color: var(--accent); }
    .mute { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 3px; color: color-mix(in oklab, var(--light) 80%, var(--dark)); }
    .mute:hover { background: color-mix(in oklab, var(--light) 14%, var(--dark)); }
    .mute.on { color: var(--accent); }
    .mute svg { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
<body>
  <div class="pill" id="pill"></div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const $ = (id) => document.getElementById(id);

    const speaker = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
    const speakerOff = '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';

    function esc(text) {
      return text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function render(view) {
      const pill = $("pill");
      const phase = view.phase.kind;
      if (phase === "recording") {
        const muted = view.muteSystem;
        pill.innerHTML = `<span class="dot"></span><span>Słucham…</span><span class="key">${esc(view.hotkey)}</span>
          <button class="mute ${muted ? "on" : ""}" id="mute" title="${muted ? "Dźwięk systemu wyciszony — kliknij, żeby grał" : "Dźwięk systemu gra — kliknij, żeby wyciszyć"}">${muted ? speakerOff : speaker}</button>`;
        $("mute").onclick = () => invoke("dictation_toggle_mute");
      } else if (phase === "transcribing") {
        pill.innerHTML = `<span>✎</span><span>Przepisuję…</span>`;
      } else if (phase === "pasted") {
        pill.innerHTML = `<span class="ok">✓</span><span>Wklejono</span>`;
      } else if (phase === "error") {
        pill.innerHTML = `<span class="warn">⚠</span><span class="msg">${esc(view.phase.message ?? "Błąd")}</span>`;
      } else {
        pill.innerHTML = "";
      }
    }

    (async () => {
      render(await invoke("dictation_state"));
      await listen("dictation", (e) => render(e.payload));
    })();
  </script>
</body>
</html>
